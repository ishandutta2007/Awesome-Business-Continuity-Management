<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06121e" />
    </linearGradient>
    <radialGradient id="glow-teal" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="25%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-emerald" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Styles and Animations -->
    <style>
      .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
      .data-flow {
        stroke-dasharray: 8 12;
        animation: flowAnimation 20s linear infinite;
      }
      .pulse-circle {
        animation: pulseEffect 3s ease-out infinite;
        transform-origin: center;
      }
      .float-badge-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .float-badge-2 { animation: floatSlow2 7s ease-in-out infinite; }
      .float-badge-3 { animation: floatSlow3 8s ease-in-out infinite; }
      .float-badge-4 { animation: floatSlow4 6.5s ease-in-out infinite; }
      
      @keyframes flowAnimation {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseEffect {
        0% { r: 12px; opacity: 0.9; }
        50% { r: 35px; opacity: 0.2; }
        100% { r: 12px; opacity: 0.9; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatSlow4 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(9px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-teal)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-blue)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-emerald)" rx="16" />

  <!-- Background Grid -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Animated Data Flows / Failover Circuits -->
  <g>
    <path d="M 80,120 Q 250,60 480,110 T 880,90 T 1120,130" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.5" class="data-flow" />
    <path d="M 100,320 Q 320,380 620,310 T 960,340 T 1140,290" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.45" class="data-flow" />
    <path d="M 120,200 C 300,160 380,260 550,220 S 850,180 1080,220" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" class="data-flow" />
  </g>

  <!-- Dynamic Animated Heartbeat / Node Signals -->
  <g>
    <circle cx="160" cy="115" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" class="pulse-circle" />
    <circle cx="160" cy="115" r="6" fill="#38bdf8" />

    <circle cx="1040" cy="305" r="18" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6" class="pulse-circle" />
    <circle cx="1040" cy="305" r="6" fill="#34d399" />
  </g>

  <!-- Dynamic Floating Decorative Tags / Badges in Outer Canvas -->
  <!-- Top Left Badge -->
  <g class="float-badge-1" transform="translate(60, 42)">
    <rect width="195" height="36" rx="18" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">⚡ RTO &lt; 15m | RPO &lt; 5m</text>
  </g>

  <!-- Top Right Badge -->
  <g class="float-badge-2" transform="translate(940, 42)">
    <rect width="200" height="36" rx="18" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="5" fill="#34d399" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">🛡️ ISO 22301 &amp; DORA</text>
  </g>

  <!-- Bottom Left Badge -->
  <g class="float-badge-3" transform="translate(60, 345)">
    <rect width="215" height="36" rx="18" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="5" fill="#818cf8" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🔄 Automated DR Failover</text>
  </g>

  <!-- Bottom Right Badge -->
  <g class="float-badge-4" transform="translate(920, 345)">
    <rect width="220" height="36" rx="18" fill="url(#card-grad)" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="5" fill="#2dd4bf" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#99f6e4">📊 Business Impact Analysis</text>
  </g>

  <!-- Central Ambient Focus Container (guarantees text remains in foreground and unhidden) -->
  <rect x="180" y="95" width="840" height="230" rx="24" fill="#090f1d" fill-opacity="0.85" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Shield / Resilient Core Icon in Center Top -->
  <g transform="translate(600, 142)">
    <circle cx="0" cy="0" r="26" fill="#0f293a" stroke="#38bdf8" stroke-width="2" filter="url(#glow-filter)" />
    <!-- Shield Path -->
    <path d="M 0,-14 L 12,-7 C 12,5 6,13 0,16 C -6,13 -12,5 -12,-7 Z" fill="#0284c7" stroke="#34d399" stroke-width="1.8" />
    <path d="M -4,1 L -1,4 L 5,-3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Title & Subtitle (High Contrast Foreground) -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="1.5" fill="url(#title-grad)" filter="url(#shadow)">
    AWESOME BUSINESS CONTINUITY MANAGEMENT
  </text>

  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.5" fill="#cbd5e1">
    Curated Hub for BCM Platforms, Disaster Recovery Planning &amp; Operational Resilience
  </text>

  <!-- Foreground Pill Badges -->
  <g transform="translate(230, 270)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="80" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe">📈 Business Impact</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="90" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#d1fae5">🚨 Crisis Orchestration</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="170" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="85" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e0e7ff">💾 Disaster Recovery</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="170" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="85" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fef3c7">🌐 Enterprise Resilience</text>
    </g>
  </g>
</svg>
